[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyalsoft"
version = "1.6.0"
description = "Function-oriented Python audio API and typed OpenAL Soft bindings with bundled runtimes"
readme = "README.md"
authors = [
  { name = "Brennan Draves", email = "dravesbrennan@gmail.com" },
]
requires-python = ">=3.12"
keywords = [
  "3d-audio",
  "audio",
  "bindings",
  "ctypes",
  "efx",
  "game-audio",
  "hrtf",
  "openal",
  "openal-soft",
  "sound",
  "spatial-audio",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
license = "MIT AND LGPL-2.0-or-later AND BSD-3-Clause AND LicenseRef-OpenAL-Registry"
license-files = [
  "LICENSE",
  "LICENSES/*",
  "vendor/openal-soft/COPYING",
  "vendor/openal-soft/LICENSE-pffft",
]

[project.urls]
Homepage = "https://github.com/BDraves/pyalsoft"
Documentation = "https://bdraves.github.io/pyalsoft/"
Source = "https://github.com/BDraves/pyalsoft"
Issues = "https://github.com/BDraves/pyalsoft/issues"
"Release notes" = "https://github.com/BDraves/pyalsoft/releases"

[project.entry-points.pyinstaller40]
hook-dirs = "pyalsoft._pyinstaller:get_hook_dirs"

[dependency-groups]
dev = [
  "coverage>=7.10.0",
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]
docs = [
  "markdown!=3.10.3",
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.6.0,<10",
  "mkdocstrings[python]>=0.29.0,<2",
]

[tool.mypy]
files = ["examples", "src", "tools", "tests"]
strict = true
exclude = ["^src/pyalsoft/bindings/_generated/"]

[[tool.mypy.overrides]]
module = ["pyalsoft.bindings", "pyalsoft.bindings.*"]
follow_imports = "silent"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-p", "no:cacheprovider", "-ra"]
markers = [
  "integration: requires a real native OpenAL runtime",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["pyalsoft"]
omit = [
  "src/pyalsoft/_pyinstaller_hooks/*",
  "src/pyalsoft/bindings/_generated/*",
]

[tool.coverage.report]
exclude_also = [
  "@overload",
]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
extend-exclude = [
  "src/pyalsoft/bindings/_generated",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pyalsoft"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/examples",
  "/docs",
  "/LICENSE",
  "/LICENSES",
  "/README.md",
  "/hatch_build.py",
  "/mkdocs.yml",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/tools",
  "/uv.lock",
  "/vendor",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyalsoft"]
dependencies = ["cmake>=3.25,<4; sys_platform != 'win32'"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
build = "cp312-manylinux_* cp312-macosx_* cp312-win_amd64"
build-frontend = "uv"
test-requires = ["pyinstaller==6.20.0"]
test-command = [
  "python {project}/examples/play_file.py",
  "python {project}/examples/play_sine.py",
  "python {project}/examples/loop_points.py",
  "python {project}/examples/play_with_reverb.py",
  "python {project}/examples/shared_effect_bus.py",
  "python {project}/examples/render_offline.py",
  "python {project}/examples/cycle_effects.py",
  "python {project}/examples/filter_sound.py",
  "python {project}/examples/select_device_hrtf.py",
  "python {project}/examples/advanced_sources.py",
  "python {project}/tools/conformance_test_runtime.py",
  "python {project}/tools/freeze_test.py",
]
environment = { ALSOFT_DRIVERS = "null" }

[tool.cibuildwheel.linux]
before-all = "test -f /opt/pyalsoft-manylinux-ready || dnf install -y alsa-lib-devel pulseaudio-libs-devel || (sleep 10 && dnf install -y alsa-lib-devel pulseaudio-libs-devel)"
test-requires = []
test-command = [
  "python {project}/examples/play_file.py",
  "python {project}/examples/play_sine.py",
  "python {project}/examples/loop_points.py",
  "python {project}/examples/play_with_reverb.py",
  "python {project}/examples/shared_effect_bus.py",
  "python {project}/examples/render_offline.py",
  "python {project}/examples/cycle_effects.py",
  "python {project}/examples/filter_sound.py",
  "python {project}/examples/select_device_hrtf.py",
  "python {project}/examples/advanced_sources.py",
  "python {project}/tools/conformance_test_runtime.py",
]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
