[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pyalsoft"
version = "0.1.0"
description = "PyALSoft provides automatically generated Python bindings for OpenAL Soft, including core OpenAL, ALC, EFX, and supported extensions"
readme = "README.md"
authors = [
  { name = "Brennan Draves", email = "dravesbrennan@gmail.com" },
]
requires-python = ">=3.12"
dependencies = []
license = "MIT AND LGPL-2.0-or-later AND BSD-3-Clause AND LicenseRef-OpenAL-Registry"
license-files = [
  "LICENSE",
  "LICENSES/*",
  "vendor/openal-soft/COPYING",
  "vendor/openal-soft/LICENSE-pffft",
]

[project.urls]
Source = "https://github.com/BDraves/pyalsoft"

[project.entry-points.pyinstaller40]
hook-dirs = "pyalsoft._pyinstaller:get_hook_dirs"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[tool.mypy]
files = ["src", "tools", "tests"]
strict = true
exclude = ["^src/pyalsoft/_generated/"]

[[tool.mypy.overrides]]
module = "pyalsoft._generated.*"
disable_error_code = ["redundant-cast", "valid-type"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-p", "no:cacheprovider", "-ra"]
markers = [
  "integration: requires a real native OpenAL runtime",
]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".cache", "src/pyalsoft/_generated", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pyalsoft"]

[tool.hatch.build.targets.sdist]
include = [
  "/docs",
  "/LICENSE",
  "/LICENSES",
  "/README.md",
  "/hatch_build.py",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/tools",
  "/uv.lock",
  "/vendor",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyalsoft"]
dependencies = ["cmake>=3.25,<4; sys_platform != 'win32'"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
build = "cp312-manylinux_* cp312-macosx_* cp312-win_amd64"
build-frontend = "uv"
test-requires = ["pyinstaller==6.20.0"]
test-command = "python {project}/tools/freeze_test.py"
environment = { ALSOFT_DRIVERS = "null" }

[tool.cibuildwheel.linux]
before-all = "dnf install -y alsa-lib-devel pulseaudio-libs-devel"
test-requires = []
test-command = "python {project}/tools/smoke_test_runtime.py"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
