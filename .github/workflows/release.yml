name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master"]
  pull_request:
    branches: ["development", "master"]
    paths:
      - ".github/workflows/native-wheels.yml"
      - "hatch_build.py"
      - "pyproject.toml"
      - "src/pyalsoft/**"
      - "tools/build_openal_soft.py"
      - "tools/freeze_test.py"
      - "tools/smoke_test_runtime.py"
      - "vendor/openal-soft/**"

permissions:
  contents: read

jobs:
  build:
    name: Wheel (${{ matrix.os }})
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Cache cibuildwheel tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ matrix.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ matrix.os }}-

      - name: Build and test native wheel
        env:
          CIBW_ARCHS: native
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
        run: uv tool run --from cibuildwheel==3.4.1 cibuildwheel --output-dir wheelhouse

      - name: Test Linux wheel with PyInstaller
        if: runner.os == 'Linux'
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          wheels=(wheelhouse/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          uv run --isolated --no-project --python 3.12 \
            --with "${wheels[0]}" \
            --with pyinstaller==6.20.0 \
            python tools/freeze_test.py

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sdist:
    name: Source distribution
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: uv build --sdist --no-sources

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: [build, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-release
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/pyalsoft
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Prepare release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(uv version --short)"
          tag="v${version}"
          tagged_commit="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$RELEASE_SHA" ]]; then
            echo "${tag} already identifies ${tagged_commit}, not ${RELEASE_SHA}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Tag release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*
