name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master"]
  pull_request:
    branches: ["development", "master"]
    # Ordinary Python changes are covered by CI's cross-platform test matrix.
    # Run release builds on PRs only when wheel/native packaging may change.
    paths:
      - ".github/workflows/release.yml"
      - ".github/manylinux/*.Dockerfile"
      - "examples/**"
      - "hatch_build.py"
      - "pyproject.toml"
      - "src/pyalsoft/_pyinstaller.py"
      - "src/pyalsoft/_pyinstaller_hooks/**"
      - "src/pyalsoft/_managed/sound/decoder.py"
      - "src/pyalsoft/bindings/_library.py"
      - "tools/audio_decoder.py"
      - "tools/build_audio_decoder.py"
      - "tools/build_openal_soft.py"
      - "tools/conformance_test_runtime.py"
      - "tools/freeze_test.py"
      - "tools/openal_soft.py"
      - "tools/smoke_test_runtime.py"
      - "vendor/audio-decoder/**"
      - "vendor/openal-soft/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Wheel (${{ matrix.os }})
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            manylinux: true
            dockerfile: .github/manylinux/x86_64.Dockerfile
            image_arch: x86_64
          - os: ubuntu-24.04-arm
            manylinux: true
            dockerfile: .github/manylinux/aarch64.Dockerfile
            image_arch: aarch64
          - os: macos-15-intel
            manylinux: false
            dockerfile: ""
            image_arch: ""
          - os: macos-latest
            manylinux: false
            dockerfile: ""
            image_arch: ""
          - os: windows-latest
            manylinux: false
            dockerfile: ""
            image_arch: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up Docker Buildx
        if: matrix.manylinux
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Load custom manylinux image
        if: matrix.manylinux
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: pyalsoft-manylinux:ci
          load: true
          cache-from: type=gha,scope=pyalsoft-manylinux-${{ matrix.image_arch }}

      - name: Cache cibuildwheel tools
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/cibw-cache
          key: cibw-${{ matrix.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            cibw-${{ matrix.os }}-

      - name: Cache built native runtimes
        if: runner.os != 'Windows'
        id: openal-cache
        uses: actions/cache@v5
        with:
          path: build/native
          key: native-v3-${{ matrix.os }}-${{ hashFiles('vendor/openal-soft/source.toml', 'vendor/audio-decoder/CMakeLists.txt', 'vendor/audio-decoder/miniaudio.h', 'vendor/audio-decoder/pyalsoft_decoder.c', 'vendor/audio-decoder/pyalsoft_decoder.h', 'vendor/audio-decoder/source.toml', 'vendor/audio-decoder/stb_vorbis.c', 'tools/audio_decoder.py', 'tools/build_audio_decoder.py', 'tools/build_openal_soft.py', 'tools/openal_soft.py', 'hatch_build.py', '.github/manylinux/*.Dockerfile') }}

      - name: Build and test native wheel
        env:
          CIBW_ARCHS: native
          CIBW_CACHE_PATH: ${{ runner.temp }}/cibw-cache
          CIBW_MANYLINUX_X86_64_IMAGE: pyalsoft-manylinux:ci
          CIBW_MANYLINUX_AARCH64_IMAGE: pyalsoft-manylinux:ci
          CIBW_ENVIRONMENT_LINUX: >-
            ALSOFT_DRIVERS=null
            PYALSOFT_NATIVE_ROOT=/host${{ github.workspace }}/build/native
        run: uv tool run --from cibuildwheel==3.4.1 cibuildwheel --output-dir wheelhouse

      - name: Verify Linux OpenAL runtime cache
        if: runner.os == 'Linux'
        shell: bash
        env:
          OPENAL_CACHE_HIT: ${{ steps.openal-cache.outputs.cache-hit }}
        run: |
          runtime="$(find build/native -type f -name 'libopenal.so.1' -print -quit)"
          if [[ -z "$runtime" ]]; then
            echo "Linux OpenAL runtime was not written to build/native." >&2
            exit 1
          fi
          echo "OpenAL cache hit: ${OPENAL_CACHE_HIT:-false}"
          echo "Cached $runtime"

      - name: Test Linux wheel with PyInstaller
        if: runner.os == 'Linux'
        shell: bash
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          wheels=(wheelhouse/*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}." >&2
            exit 1
          fi
          uv run --isolated --no-project --python 3.12 \
            --with "${wheels[0]}" \
            --with pyinstaller==6.20.0 \
            python tools/freeze_test.py

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sdist:
    name: Source distribution
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build source distribution
        run: uv build --sdist --no-sources

      - name: Install OpenAL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev libpulse-dev

      - name: Install and smoke-test source distribution
        env:
          ALSOFT_DRIVERS: "null"
        run: |
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "Expected exactly one source distribution, found ${#sdists[@]}." >&2
            exit 1
          fi
          uv run --isolated --no-project --python 3.12 \
            --with "${sdists[0]}" \
            python tools/smoke_test_runtime.py

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: [build, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-release
      cancel-in-progress: false
      queue: max
    environment:
      name: pypi
      url: https://pypi.org/p/pyalsoft
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Prepare release
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version="$(uv version --short)"
          tag="v${version}"
          tagged_commit="$(git rev-list -n 1 "$tag" 2>/dev/null || true)"
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$RELEASE_SHA" ]]; then
            echo "${tag} already identifies ${tagged_commit}, not ${RELEASE_SHA}." >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Prepare release notes
        shell: bash
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          uv run --no-project --python 3.12 python tools/changelog.py \
            "$RELEASE_VERSION" > "$notes_file"
          echo "RELEASE_NOTES_FILE=${notes_file}" >> "$GITHUB_ENV"

      - name: Tag release commit
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$RELEASE_NOTES_FILE"
          fi

      - name: Publish to PyPI
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  docs:
    name: Build documentation
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --locked --no-install-project --python 3.12 --group docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-docs:
    name: Publish documentation
    needs: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
